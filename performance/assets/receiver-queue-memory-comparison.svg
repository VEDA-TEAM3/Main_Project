<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Receiver queue memory comparison</title>
  <desc id="desc">Queue memory after 160 messages of approximately 60 KiB, and theoretical maximum.</desc>
  <rect width="1100" height="520" rx="18" fill="#0f172a"/>
  <text x="55" y="55" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="700">Receiver Queue — 메모리 상한 비교</text>
  <text x="55" y="86" fill="#94a3b8" font-family="sans-serif" font-size="16">약 60KiB payload 160건 입력 · topic+payload 회계</text>

  <text x="55" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="18">이전 001216d</text>
  <rect x="250" y="120" width="704" height="44" rx="8" fill="#f97316"/>
  <text x="970" y="149" fill="#fdba74" font-family="sans-serif" font-size="17" font-weight="700">9.38 MiB · 160건 전부 유지</text>

  <text x="55" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="18">최신 8ca541e</text>
  <rect x="250" y="200" width="598" height="44" rx="8" fill="#14b8a6"/>
  <line x1="850" y1="184" x2="850" y2="263" stroke="#f8fafc" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="864" y="229" fill="#5eead4" font-family="sans-serif" font-size="17" font-weight="700">7.97 MiB · 136건 유지</text>
  <text x="850" y="282" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14">8MiB hard limit</text>

  <rect x="55" y="330" width="990" height="130" rx="12" fill="#1e293b"/>
  <text x="80" y="365" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">최악 메모리 모델</text>
  <text x="80" y="400" fill="#fca5a5" font-family="sans-serif" font-size="17">이전: 메시지 4,096개만 제한 → 64KiB급 입력이면 payload만 약 256MiB</text>
  <text x="80" y="433" fill="#6ee7b7" font-family="sans-serif" font-size="17">최신: 메시지 개수 + 총 8MiB 동시 제한 → 입력 크기와 무관하게 queue 상한 고정</text>
</svg>
