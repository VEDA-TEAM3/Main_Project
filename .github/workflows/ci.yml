name: CI

# 보안 방어선의 자동 집행자.
# 감사에서 적용한 방어들(파서 상한/NaN 거부, 새니타이저 임계값 throw, 라우터 무할당 계약,
# 매퍼 특이행렬 거부, Source lost-wakeup 수정 등)이 조용히 회귀하지 않도록
# 모든 push/PR 에서 빌드 + 테스트를 강제한다.
#
# Linux 에서 두 서버와 모든 GTest를, Windows 에서 Qt 클라이언트와 자체 검사를 빌드·실행한다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 같은 브랜치에서 새 커밋이 올라오면 진행 중이던 실행을 취소 (러너 낭비 방지)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Ubuntu / GCC)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 프로덕션 빌드에 필요한 것만 설치한다.
      # GTest/GMock 은 여기 없다 -- 루트 CMakeLists 의 FetchContent 가 가져오므로
      # 러너의 패키지 버전에 테스트가 좌우되지 않는다
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libmosquitto-dev \
            libssl-dev \
            nlohmann-json3-dev

      # FetchContent 가 내려받은 googletest 를 커밋 간에 재사용한다.
      # 키에 루트 CMakeLists.txt 해시를 넣어, GIT_TAG 를 바꾸면 캐시가 자동 무효화된다
      - name: Cache googletest (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-deps-

      # 범위를 좁히는 플래그를 주지 않는다 -> VEDA_BUILD_CONTROL_SERVER 기본값(ON)으로
      # 두 서버가 모두 빌드된다
      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      # 저장소 전체를 빌드한다: compute-server + control-server + 모든 테스트 타깃.
      - name: Build
        run: cmake --build build --parallel

      # GTest 케이스는 gtest_discover_tests 로 개별 등록되므로
      # 실패 시 어느 TEST() 가 깨졌는지 ctest 출력만으로 알 수 있다
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 2

      # 실패한 실행을 사후 분석할 수 있도록 CTest 로그를 남긴다
      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/Testing/
          if-no-files-found: ignore
          retention-days: 7

  sanitizers:
    name: ASan/UBSan & Coverage
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libmosquitto-dev \
            libssl-dev \
            nlohmann-json3-dev \
            gcovr

      - name: Configure ASan and UBSan
        run: >
          cmake -B build-asan -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DVEDA_BUILD_CONTROL_SERVER=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build ASan and UBSan
        run: >
          cmake --build build-asan --parallel
          --target compute-server ParserTest SanitizerTest RouterTest MapperTest NetworkTest SourceTest MqttSinkTest DriverProtocolTest ControllerTest AggregatorTest FuserTest TransformEquivalenceTest ZoneMapperEquivalenceTest MetricTest RiskTest ParkingPolicyTest MqttReceiverTest PipelineTrajectoryTest SerialHwEventDispatcherTest

      - name: Test ASan and UBSan
        run: >
          ctest --test-dir build-asan --output-on-failure --parallel 2
          -R "ParserTest|SanitizerTest|RouterTest|MapperTest|NetworkTest|SourceTest|MqttSinkTest|DriverProtocolTest|ControllerTest|AggregatorTest|FuserTest|TransformEquivalenceTest|ZoneMapperEquivalenceTest|MetricTest|RiskTest|ParkingPolicyTest|MqttReceiverTest|PipelineTrajectoryTest|SerialHwEventDispatcherTest"

      - name: Configure coverage
        run: >
          cmake -B build-coverage -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DVEDA_BUILD_CONTROL_SERVER=OFF
          -DCMAKE_CXX_FLAGS="--coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build coverage targets
        run: >
          cmake --build build-coverage --parallel
          --target compute-server ParserTest SanitizerTest RouterTest MapperTest NetworkTest SourceTest MqttSinkTest

      - name: Test coverage targets
        run: >
          ctest --test-dir build-coverage --output-on-failure --parallel 2
          -R "ParserTest|SanitizerTest|RouterTest|MapperTest|NetworkTest|SourceTest|MqttSinkTest"

      - name: Enforce compute source coverage
        run: >
          gcovr --root . --filter "compute-server/src/"
          --object-directory build-coverage
          --gcov-ignore-errors=no_working_dir_found
          --fail-under-line 33 --txt --print-summary

  client-build-and-test:
    name: Client Build & Test (Windows / UCRT64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW, Qt, and GStreamer
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-mqtt

      - name: Configure
        shell: msys2 {0}
        run: >
          cmake -S client -B client/build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTCCTV_BUILD_CHECKS=ON
          -DQTCCTV_ENABLE_PCH=OFF
          -DGSTREAMER_ROOT=C:/msys64/ucrt64
          -DOpenCV_DIR=C:/msys64/ucrt64/lib/cmake/opencv4

      - name: Build
        shell: msys2 {0}
        run: cmake --build client/build-ci --parallel 2

      - name: Test
        shell: msys2 {0}
        env:
          GST_PLUGIN_PATH: C:/msys64/ucrt64/lib/gstreamer-1.0
        run: ctest --test-dir client/build-ci --output-on-failure --parallel 2
